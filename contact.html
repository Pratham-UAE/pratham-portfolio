<template id="view-tpl">
  <div class="page"><div class="sp" data-t="dk">
    <section class="ct-hero" data-t="lt">
      <div class="tx">
        <h1>Let’s make something<em>loud.</em></h1>
        <div class="mail"><span>media@l1re.com</span><a class="pill white" href="mailto:media@l1re.com" style="height:36px;padding:0 20px">Write ↗</a></div>
        <div class="soc"><a href="#">Instagram ↗</a><a href="#">LinkedIn ↗</a><a href="#">WhatsApp ↗</a></div>
      </div>
      <img src="assets/wallpaper-outer.jpg" alt="">
    </section>
    <section class="ct-form" data-t="dk">
      <div class="sp-head"><h1 class="sp-h1">Brief me</h1><span class="side t-mono">Share the project</span></div>
      <form>
        <div class="fld"><label class="t-mono" for="f-name">Your name</label><input id="f-name" name="name" placeholder="Jane Smith" autocomplete="name"></div>
        <div class="fld"><label class="t-mono" for="f-email">Email</label><input id="f-email" name="email" type="email" placeholder="jane@company.com" autocomplete="email"></div>
        <div class="fld"><label class="t-mono" for="f-co">Company / project</label><input id="f-co" name="company" placeholder="Your brand or project name"></div>
        <div class="fld"><label class="t-mono" for="f-brief">About the project</label><textarea id="f-brief" name="brief" placeholder="What are we making, when, and for whom?"></textarea></div>
        <button class="submit" type="submit">Submit</button>
      </form>
      <div class="sp-end"></div>
    </section>
  </div></div>
