/* Layout: one iOS app with three screens (Home feed, Reels, Profile) under a floating glass tab bar. Full-screen on a phone; inside an iPhone frame beside a short intro on larger screens. */
:root{
  --bg:#ffffff; --fg:#000000; --soft:#8e8e93; --line:#d1d1d6; --chip:#f2f2f7; --primary:#0a84ff; --media:#f2f2f7; --like:#ff3b30;
  --bar:rgba(255,255,255,.74);
  --g-bg:rgba(255,255,255,.58); --g-brd:rgba(255,255,255,.95); --g-edge:rgba(0,0,0,.07); --g-pill:rgba(0,0,0,.09); --g-shadow:0 12px 34px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.07); --g-shine:rgba(255,255,255,.7);
  --page:#eeeef2; --page-fg:#0b0b0f; --page-soft:#6c6c72;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ring:conic-gradient(from 200deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --dock:calc(64px + max(12px,var(--sab)));
  --ease:cubic-bezier(.22,.9,.24,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#000000; --fg:#ffffff; --soft:#98989f; --line:#2c2c2e; --chip:#1c1c1e; --media:#0d0d0f; --bar:rgba(0,0,0,.66);
    --g-bg:rgba(58,58,64,.42); --g-brd:rgba(255,255,255,.2); --g-edge:rgba(255,255,255,.05); --g-pill:rgba(255,255,255,.17); --g-shadow:0 14px 40px rgba(0,0,0,.65),0 2px 8px rgba(0,0,0,.4); --g-shine:rgba(255,255,255,.22);
    --page:#08080a; --page-fg:#f5f5f7; --page-soft:#98989f; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#000000; --fg:#ffffff; --soft:#98989f; --line:#2c2c2e; --chip:#1c1c1e; --media:#0d0d0f; --bar:rgba(0,0,0,.66);
    --g-bg:rgba(58,58,64,.42); --g-brd:rgba(255,255,255,.2); --g-edge:rgba(255,255,255,.05); --g-pill:rgba(255,255,255,.17); --g-shadow:0 14px 40px rgba(0,0,0,.65),0 2px 8px rgba(0,0,0,.4); --g-shine:rgba(255,255,255,.22);
    --page:#08080a; --page-fg:#f5f5f7; --page-soft:#98989f; color-scheme:dark }
:root[data-theme="light"]{color-scheme:light}
/* screens that sit on black (Reels) always use the dark glass */
.on-dark{ --fg:#ffffff; --soft:#b9b9c0; --g-bg:rgba(58,58,64,.42); --g-brd:rgba(255,255,255,.2); --g-edge:rgba(255,255,255,.05); --g-pill:rgba(255,255,255,.17); --g-shadow:0 14px 40px rgba(0,0,0,.65),0 2px 8px rgba(0,0,0,.4); --g-shine:rgba(255,255,255,.22) }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:18px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg{display:block}
.ic{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* the glass material: blurred, saturated backdrop, bright rim, soft top shine */
.glass{position:relative;background:var(--g-bg);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:.5px solid var(--g-brd);box-shadow:var(--g-shadow),inset 0 1px 0 var(--g-shine),inset 0 -1px 0 var(--g-edge)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,var(--g-shine),transparent 42%);opacity:.35;pointer-events:none}

.device{height:100dvh;position:relative;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.screen{position:relative;height:100%;overflow:hidden;background:var(--bg)}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:var(--dock)}
.aside,.brand,.lbl,.uname,.i-close{display:none}

/* top bars */
.top,.vbar{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
.top{position:sticky;top:0;z-index:3;height:calc(48px + var(--sat));padding:var(--sat) 14px 0 16px;display:flex;align-items:center;justify-content:space-between}
.top b{font-size:22px;font-weight:700;letter-spacing:-.022em}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .25s var(--ease)}
.round:active{transform:scale(.9)}
.round .ic{width:19px;height:19px;position:relative}
.tr{display:flex;gap:8px}
.i-sun{display:none}
:root[data-theme="dark"] .i-sun{display:block}:root[data-theme="dark"] .i-moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .i-sun{display:block}:root:not([data-theme="light"]) .i-moon{display:none}}
.dockbar .themeside{display:none}

/* profile header */
.head{display:grid;grid-template-columns:auto 1fr;column-gap:22px;align-items:center;padding:6px 16px 0}
.dp{width:90px;height:90px;border-radius:50%;padding:2.5px;background:var(--ring)}
.dp>div{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);background:linear-gradient(160deg,#4b4f57,#17181b);display:grid;place-items:center;color:#fff;font-weight:600;font-size:27px;letter-spacing:-.02em;overflow:hidden}
.dp img,.mini img,.me img,.story i img{width:100%;height:100%;object-fit:cover}
.id{display:flex;flex-direction:column;gap:9px;min-width:0}
.id .name{font-weight:600;font-size:15px;letter-spacing:-.01em}
.stats{display:flex;gap:28px;margin:0;padding:0;list-style:none}
.stats li{display:flex;flex-direction:column}
.stats b{font-size:17px;font-weight:600;line-height:21px;letter-spacing:-.02em}
.stats span{font-size:13px;line-height:17px}
.bio{grid-column:1/-1;padding-top:12px;display:flex;flex-direction:column;font-size:14px;line-height:19px}
.bio .role{color:var(--soft)}
.bio p{margin:0;white-space:pre-line}
.actions{grid-column:1/-1;display:flex;gap:7px;padding-top:14px}
.btn{flex:1;min-width:0;height:36px;border-radius:12px;font-weight:600;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;white-space:nowrap;padding:0 10px;transition:transform .25s var(--ease),opacity .2s}
.btn.glass{box-shadow:inset 0 1px 0 var(--g-shine),inset 0 -1px 0 var(--g-edge);background:var(--g-pill)}
.btn span{position:relative}
.btn.primary{background:linear-gradient(180deg,#3d9bff,#0a84ff);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 14px rgba(10,132,255,.35)}
.btn:active{transform:scale(.96);opacity:.8}

/* highlights / stories */
.hl{display:flex;gap:12px;overflow-x:auto;padding:18px 14px 14px;scrollbar-width:none}
.hl::-webkit-scrollbar{display:none}
.hl button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;line-height:14px;width:72px;flex:none;transition:transform .2s var(--ease)}
.hl button:active{transform:scale(.94)}
.hl i{width:66px;height:66px;border-radius:50%;border:1px solid var(--line);padding:3px;display:block}
.hl i span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--chip);overflow:hidden}
.hl i svg{width:24px;height:24px;stroke-width:1.5}
.hl .story i{border:0;padding:2.5px;background:var(--ring)}
.hl .story i span{border:2.5px solid var(--bg);background:linear-gradient(160deg,#4b4f57,#17181b);color:#fff;font-weight:600;font-size:19px;font-style:normal}
.hl.feedrow{border-bottom:.5px solid var(--line);padding-top:8px}

/* tabs + grid */
.tabs{display:flex;border-bottom:.5px solid var(--line)}
.tabs button{flex:1;height:44px;display:grid;place-items:center;color:var(--soft);position:relative;transition:color .2s}
.tabs button[aria-selected="true"]{color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;padding-top:1.5px}
.post{position:relative;aspect-ratio:3/4;overflow:hidden;color:#fff;text-align:left;display:block;width:100%;transition:opacity .15s}
.post:active{opacity:.7}
.post>img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post.has-cover::before{display:none}
.post.has-cover .multi{display:none}
.post::before{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.13),transparent 46%),linear-gradient(to top,rgba(0,0,0,.42),transparent 55%)}
.post .thumb{position:absolute;left:11%;right:11%;top:13%;height:47%}
.post .thumb img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.post .mark{position:absolute;left:10%;top:9%;font-size:50px;line-height:1;font-weight:200;letter-spacing:-.04em;opacity:.92}
.post .cap{position:absolute;left:10%;right:8%;bottom:9%;display:flex;flex-direction:column;gap:3px}
.post .cap small{font-size:8.5px;line-height:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;opacity:.66}
.post .cap strong{font-size:15.5px;line-height:18px;font-weight:600;letter-spacing:-.02em}
.post .multi{position:absolute;right:7px;top:7px;width:16px;height:16px;z-index:1;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}

/* mockup covers: devices drawn in CSS, sized in cqw so they scale with the tile */
.post.sc{container-type:inline-size;background:radial-gradient(80cqw 70cqw at 70% 30%,color-mix(in srgb,var(--acc) 34%,transparent),transparent 70%),linear-gradient(180deg,#17171b,#08080a)}
.post.sc::before{z-index:2;background:linear-gradient(to top,rgba(0,0,0,.8),transparent 42%)}
.post.sc .cap{left:9cqw;right:8cqw;bottom:8cqw;z-index:3;gap:1.5cqw}
.post.sc .cap strong{font-size:12cqw;line-height:1.05;letter-spacing:-.03em}
.post.sc .cap small{font-size:7.2cqw;line-height:1.2;font-weight:400;letter-spacing:0;text-transform:none;opacity:.62}
.post.sc .multi{z-index:3}
.sn{position:absolute;inset:0}
.sn span,.sn i,.sn b,.sn img{position:absolute;display:block;font-style:normal}
.sn .laptop{left:13cqw;right:13cqw;top:20cqw;height:50cqw;transform:perspective(170cqw) rotateY(-18deg) rotateX(7deg);filter:drop-shadow(0 6cqw 8cqw rgba(0,0,0,.55))}
.sn .laptop i{inset:0 0 3cqw;border:1.6cqw solid #202024;border-radius:3cqw 3cqw 0 0;background:#fff left top/cover no-repeat}
.sn .laptop b{left:-7cqw;right:-7cqw;bottom:0;height:3cqw;border-radius:0 0 4cqw 4cqw;background:linear-gradient(#d6d6db,#85858c)}
.sn .shot3{left:3cqw;right:3cqw;top:12cqw;height:76cqw;background:center/contain no-repeat;filter:drop-shadow(0 6cqw 8cqw rgba(0,0,0,.55))}
.sn .bcard{width:54cqw;aspect-ratio:1.62;border-radius:3cqw;filter:drop-shadow(0 4cqw 6cqw rgba(0,0,0,.5));background-repeat:no-repeat}
.sn .c-back{left:14cqw;top:22cqw;transform:rotate(-14deg);background-color:#e06a12;background-size:205%;background-position:0 0}
.sn .c-front{left:30cqw;top:38cqw;transform:rotate(7deg);background-color:#fff;background-size:250%;background-position:100% 0}
.sn .swatch{right:10cqw;top:16cqw;width:16cqw;aspect-ratio:1;border-radius:4cqw;background:#17171a;border:.5px solid rgba(255,255,255,.25);box-shadow:-5cqw 5cqw 0 -1cqw var(--acc)}
.sn .lanyard{left:50%;top:-4cqw;width:3cqw;height:24cqw;margin-left:-1.5cqw;background:var(--acc);transform:rotate(4deg);transform-origin:top}
.sn .badge{left:27cqw;top:18cqw;width:46cqw;aspect-ratio:3/4.1;border-radius:5cqw;background:linear-gradient(170deg,#fafafc,#d9d9e0);transform:rotate(4deg);filter:drop-shadow(0 6cqw 8cqw rgba(0,0,0,.55))}
.sn .badge::before{content:"";position:absolute;left:50%;top:3cqw;width:10cqw;height:2.4cqw;margin-left:-5cqw;border-radius:2cqw;background:#17171a}
.sn .badge .pj{left:50%;top:22%;width:38%;aspect-ratio:1;margin-left:-19%;border-radius:50%;background:linear-gradient(160deg,#4b4f57,#17181b);color:#fff;display:grid;place-items:center;font-size:7cqw;font-weight:600;overflow:hidden}
.sn .badge .pj img{position:static;width:100%;height:100%;object-fit:cover}
.sn .badge .n1{left:18%;right:18%;top:62%;height:5.5%;border-radius:1cqw;background:#17171a}
.sn .badge .n2{left:28%;right:28%;top:72%;height:4.5%;border-radius:1cqw;background:#8f8f98}
.sn .badge .chip{left:32%;right:32%;bottom:7%;height:7%;border-radius:2cqw;background:var(--acc)}
.sn .apps{left:17cqw;top:14cqw;width:66cqw;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5cqw;transform:perspective(170cqw) rotateX(18deg) rotateZ(-8deg);filter:drop-shadow(0 6cqw 8cqw rgba(0,0,0,.5))}
.sn .apps i{position:static;border-radius:28%;box-shadow:inset 0 .5cqw 0 rgba(255,255,255,.35)}
/* the Reels cover: bright, and the centre phone plays through the reel frames */
.post.sc.hot{background:radial-gradient(90cqw 80cqw at 85% 8%,#ffd24a,transparent 60%),linear-gradient(165deg,#ff2d75 0%,#ff5a3c 52%,#ff9a2e 100%)}
.post.sc.hot::before{background:linear-gradient(to top,rgba(60,0,20,.82),transparent 40%)}
.sn .ph{aspect-ratio:9/18.5;border-radius:7cqw;background:#101013;padding:1.3cqw;filter:drop-shadow(0 5cqw 8cqw rgba(70,0,20,.55));overflow:hidden}
.sn .ph img{inset:1.3cqw;width:calc(100% - 2.6cqw);height:calc(100% - 2.6cqw);object-fit:cover;border-radius:5.8cqw}
.sn .ph.l{left:5cqw;top:25cqw;width:31cqw;transform:rotate(-13deg)}
.sn .ph.r{right:5cqw;top:25cqw;width:31cqw;transform:rotate(13deg)}
.sn .ph.m{left:29cqw;top:11cqw;width:42cqw;z-index:1}
.sn .ph.m::after{content:"";position:absolute;left:50%;top:3.2cqw;width:11cqw;height:3cqw;margin-left:-5.5cqw;border-radius:2cqw;background:#000;z-index:2}
.sn .ph.m .f{opacity:0;animation:reelfade 10s infinite}
.sn .ph.m .f:nth-of-type(2){animation-delay:2.5s}.sn .ph.m .f:nth-of-type(3){animation-delay:5s}.sn .ph.m .f:nth-of-type(4){animation-delay:7.5s}
@keyframes reelfade{0%{opacity:0}4%,25%{opacity:1}29%,100%{opacity:0}}
.sn .playb{left:50%;top:44%;width:13cqw;height:13cqw;margin:-6.5cqw 0 0 -6.5cqw;border-radius:50%;z-index:2;background:rgba(255,255,255,.24);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:.5px solid rgba(255,255,255,.6)}
.sn .playb::after{content:"";position:absolute;left:5cqw;top:3.6cqw;border-left:4.4cqw solid #fff;border-top:2.9cqw solid transparent;border-bottom:2.9cqw solid transparent}
.sn .prog{left:12%;right:12%;bottom:6%;height:.9cqw;border-radius:1cqw;background:rgba(255,255,255,.35);z-index:2;overflow:hidden}
.sn .prog::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:reelprog 2.5s linear infinite}
@keyframes reelprog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sn .views{left:7cqw;top:7cqw;z-index:3;font-size:6.6cqw;line-height:1;font-weight:600;color:#fff;padding:3cqw 4.6cqw;border-radius:99px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px) saturate(1.6);backdrop-filter:blur(10px) saturate(1.6);border:.5px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
@media (prefers-reduced-motion:reduce){.sn .ph.m .f{animation:none}.sn .ph.m .f:nth-of-type(1){opacity:1}.sn .prog::after{animation:none;transform:scaleX(.4)}}
/* message screen, styled as a DM thread */
.dockbar{--tw:74px}
@media (max-width:359px){.dockbar{--tw:66px}}
@media (max-width:767px){.dockbar #side-dm{order:1}.dockbar [data-view="profile"]{order:2}}
.dm{position:absolute;inset:0;z-index:15;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;visibility:hidden}
.dm.open{visibility:visible}
.dm-top{flex:none;display:flex;align-items:center;gap:10px;height:calc(52px + var(--sat));padding:var(--sat) 12px 0 10px;border-bottom:.5px solid var(--line)}
.dm-top .who{display:flex;flex-direction:column;line-height:17px;min-width:0}
.dm-top .who b{font-size:15px;font-weight:600}
.dm-top .who span{font-size:12px;color:var(--soft)}
.dm-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 14px 10px;display:flex;flex-direction:column;gap:4px}
.dm-intro{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 22px;text-align:center}
.dm-intro .mini{width:84px;height:84px;font-size:26px;margin-bottom:8px}
.dm-intro b{font-size:18px;font-weight:600;letter-spacing:-.02em}
.dm-intro span{font-size:13px;color:var(--soft)}
.dm-day{align-self:center;font-size:11.5px;color:var(--soft);padding:4px 0 10px}
.bub{max-width:78%;padding:9px 14px;border-radius:20px;font-size:15px;line-height:20px;overflow-wrap:anywhere;white-space:pre-wrap;animation:bub .3s var(--ease) both}
.bub.them{align-self:flex-start;background:var(--chip);border-bottom-left-radius:6px}
.bub.mine{align-self:flex-end;color:#fff;background:linear-gradient(160deg,#7a5cff,#3d7bff);border-bottom-right-radius:6px;margin-top:8px}
.bub.them+.bub.mine,.bub.mine+.bub.them{margin-top:10px}
@keyframes bub{from{opacity:0;transform:translateY(8px) scale(.97)}}
.dm-send{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dm-send a{height:36px;padding:0 16px;border-radius:99px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:#fff;background:var(--primary)}
.dm-send a.wa{background:#1fa855}
.dm-send svg{width:17px;height:17px}
.dm-quick{flex:none;display:flex;gap:8px;overflow-x:auto;padding:6px 14px 8px;scrollbar-width:none}
.dm-quick::-webkit-scrollbar{display:none}
.dm-quick button{flex:none;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.dm-quick button:active{background:var(--chip)}
.dm-form{flex:none;display:flex;align-items:center;gap:8px;margin:0 12px calc(var(--dock) + 6px);padding:5px 6px 5px 16px;border-radius:99px;border:1px solid var(--line)}
.dm-form input{flex:1;min-width:0;height:34px;border:0;outline:0;background:none;color:inherit;font:inherit;font-size:16px}
.dm-form input::placeholder{color:var(--soft)}
.dm-form button{height:34px;padding:0 14px;border-radius:99px;font-weight:600;font-size:15px;color:var(--primary)}
.dm-form button:disabled{opacity:.35}
@media (prefers-reduced-motion:reduce){.dm,.dm.open{transition:none}.bub{animation:none}}

/* loading screen */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);display:grid;place-items:center;transition:opacity .45s ease,visibility 0s .45s}
.splash.done{opacity:0;visibility:hidden;pointer-events:none}
.sp-dp{position:relative;width:104px;height:104px;animation:sp-in .6s var(--ease) both}
.sp-dp::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ring);animation:sp-spin 1.15s linear infinite}
.sp-dp span{position:absolute;inset:3px;border-radius:50%;border:3.5px solid var(--bg);background:linear-gradient(160deg,#4b4f57,#17181b);color:#fff;display:grid;place-items:center;font-weight:600;font-size:30px;letter-spacing:-.02em;overflow:hidden}
.sp-dp img{width:100%;height:100%;object-fit:cover}
.sp-from{position:absolute;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom,0px));text-align:center;display:flex;flex-direction:column;gap:3px;animation:sp-in .6s .15s var(--ease) both}
.sp-from small{font-size:12.5px;color:var(--soft)}
.sp-from b{font-size:17px;font-weight:600;letter-spacing:-.02em;background:linear-gradient(90deg,#fa7e1e,#d62976 50%,#4f5bd5);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes sp-spin{to{transform:rotate(360deg)}}
@keyframes sp-in{from{opacity:0;transform:scale(.9)}}
@media (prefers-reduced-motion:reduce){.sp-dp::before,.sp-dp,.sp-from{animation:none}.splash{transition:none}}
.empty{grid-column:1/-1;text-align:center;color:var(--soft);padding:48px 16px}

/* floating glass tab bar */
.dockbar{position:absolute;left:50%;bottom:max(12px,var(--sab));transform:translateX(-50%);z-index:20;border-radius:99px;padding:5px;display:flex}
.dockbar .pill{position:absolute;left:5px;top:5px;width:var(--tw);height:46px;border-radius:99px;background:var(--g-pill);box-shadow:inset 0 1px 0 var(--g-shine),inset 0 -1px 0 var(--g-edge);will-change:transform;transition:background .25s,box-shadow .25s}
.dockbar button svg.ic{transform-origin:center}
.dockbar button{position:relative;width:var(--tw);height:46px;display:grid;place-items:center;border-radius:99px;transition:transform .25s var(--ease)}
.dockbar button:active{transform:scale(.88)}
.dockbar button[aria-current="page"] .ic{stroke-width:2.1}
@media (max-width:767px){.dockbar{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}}
.dockbar.drag{cursor:grabbing}
.dockbar.drag button{transform:none}
.dockbar.drag .pill,.dockbar.glide .pill{background:color-mix(in srgb,var(--g-pill) 100%,#fff 16%);box-shadow:inset 0 1px 0 var(--g-shine),inset 0 -1px 0 var(--g-edge),0 8px 22px rgba(0,0,0,.28)}
.dockbar button.peek svg.ic,.dockbar button.peek .me{transform:scale(1.2)}
.dockbar button svg.ic,.dockbar button .me{transition:transform .22s var(--ease)}
#side-dm[aria-current="page"] .ic{fill:currentColor;stroke-width:1.4}
.me{width:27px;height:27px;border-radius:50%;border:1.5px solid transparent;padding:1.5px;display:block;transition:border-color .2s}
.dockbar button[aria-current="page"] .me{border-color:var(--fg)}
.me span{width:100%;height:100%;border-radius:50%;background:linear-gradient(160deg,#4b4f57,#17181b);color:#fff;display:grid;place-items:center;font-weight:600;font-size:8.5px;overflow:hidden}

.toast{position:absolute;left:50%;bottom:calc(var(--dock) + 10px);transform:translateX(-50%);z-index:30;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;white-space:nowrap}
.toast span{position:relative}

/* a post, used in the Home feed and when a grid tile opens */
.card{padding-bottom:10px}
.vhead{display:flex;align-items:center;gap:10px;padding:10px 12px}
.mini{width:32px;height:32px;border-radius:50%;background:linear-gradient(160deg,#4b4f57,#17181b);color:#fff;display:grid;place-items:center;font-weight:600;font-size:11px;overflow:hidden;flex:none}
.vhead div{flex:1;min-width:0;line-height:16px}

.vhead div span{display:block;font-size:12px;color:var(--soft)}
.stage{position:relative;background:var(--media)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:var(--ar,1/1);max-height:62dvh;width:100%}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;min-width:0;height:100%;position:relative}
.slide img{width:100%;height:100%;object-fit:contain;padding:14px}

.slide.text h3{margin:0;font-weight:700;font-size:26px;line-height:1.08;letter-spacing:-.03em;text-wrap:balance}

.slide.text ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;font-size:15px;line-height:20px;user-select:text;-webkit-user-select:text;width:100%}
.slide.text li{padding:9px 0;border-top:.5px solid rgba(255,255,255,.2)}
.nav{position:absolute;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;display:none;place-items:center;color:#fff;--g-bg:rgba(40,40,44,.45);--g-brd:rgba(255,255,255,.3);--g-shine:rgba(255,255,255,.3);--g-shadow:0 2px 10px rgba(0,0,0,.3)}

.acts{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 6px 2px}

.heart[aria-pressed="true"] svg{fill:var(--like);stroke:var(--like);animation:pop .35s var(--ease)}

.dots{display:flex;justify-content:center;gap:4px}

/* opened post: pushes in from the right like an iOS navigation stack */
.viewer{position:absolute;inset:0;z-index:10;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-bottom:var(--dock);transform:translateX(100%);visibility:hidden;transition:transform .42s var(--ease),visibility 0s .42s;box-shadow:-12px 0 40px rgba(0,0,0,.18)}

#view-reels{background:#000;color:#fff;padding-bottom:0;scroll-snap-type:y mandatory;scrollbar-width:none}

.rcard::after{content:"";position:absolute;inset:auto 0 0;height:46%;background:linear-gradient(to top,rgba(0,0,0,.72),transparent);pointer-events:none}
.rmeta{position:absolute;left:14px;right:78px;bottom:calc(var(--dock) + 10px);z-index:2;display:flex;flex-direction:column;gap:8px}

.rside{position:absolute;right:10px;bottom:calc(var(--dock) + 10px);z-index:2;display:flex;flex-direction:column;gap:12px}

.rside .round .ic{width:22px;height:22px}

/* phone on its side (narrow enough to keep the phone layout): reel picture beside the caption */
@media (max-width:767px) and (orientation:landscape) and (max-height:500px){
  .reel .shot{top:calc(var(--sat) + 10px);bottom:calc(var(--dock) + 2px);height:calc(100% - var(--sat) - var(--dock) - 12px);left:36%;right:64px;width:auto;padding:0}

  document.addEventListener("keydown",function(e){if(!viewer.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowRight")openCard.go(1);if(e.key==="ArrowLeft")openCard.go(-1)});

  /* message screen: a DM-style thread that hands the message to WhatsApp or email */
  var dm=$("dm"),dmBody=$("dm-body"),dmInput=$("dm-input"),dmOpener=null,dmStarted=false;
  var WA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.300 12a8.300 8.300 0 0 1-12.300 7.300l-4.200 1 1-4.200A8.300 8.300 0 1 1 20.300 12z"/></svg>',
      EM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.500"/><path d="m3.500 7 8.500 6 8.500-6"/></svg>';
  var first=(P.name||"").split(" ")[0];
  face($("dm-mini"));face($("dm-face"));$("dm-name").textContent=P.name;$("dm-name2").textContent=P.name;$("dm-user").textContent=P.username;$("dm-role").textContent=P.role+" · "+P.location;
  function bubble(who,text){var b=el("div","bub "+who,text);dmBody.appendChild(b);dmBody.scrollTop=dmBody.scrollHeight;return b}
  function dmSend(text){
    text=(text||"").trim();if(!text)return;
    bubble("mine",text);dmInput.value="";$("dm-go").disabled=true;$("dm-quick").hidden=true;
    setTimeout(function(){
      var b=bubble("them","Thanks! This page can't send messages by itself, so pick where to send it and it opens ready to go:");
      var row=el("div","dm-send"),w=el("a","wa"),e=el("a");
      w.innerHTML=WA;w.appendChild(document.createTextNode("WhatsApp"));w.target="_blank";w.rel="noopener";
      w.href="https://wa.me/"+(P.whatsapp||P.phone||"").replace(/\D/g,"")+"?text="+encodeURIComponent(text);
      e.innerHTML=EM;e.appendChild(document.createTextNode("Email"));
      e.href=mail+"?subject="+encodeURIComponent("Message from your portfolio")+"&body="+encodeURIComponent(text);
      row.appendChild(w);row.appendChild(e);b.appendChild(row);dmBody.scrollTop=dmBody.scrollHeight;
    },450);
  }
  /* iOS-style selection slide: the glass pill stretches as it travels, overshoots a touch and settles */
  var pillSlot=0,pillAnim=null,pillEl=$("pill"),calm=window.matchMedia("(prefers-reduced-motion:reduce)");
  function pillX(slot){return slot*pillEl.offsetWidth}
  var dock=document.querySelector(".dockbar"),pressAnim=null;
  function runPill(frames,opts){
    var a=pillEl.animate(frames,opts);pillAnim=a;dock.classList.add("glide");
    a.onfinish=a.oncancel=function(){if(pillAnim===a){pillAnim=null;dock.classList.remove("glide")}};
  }
  function lift(){ /* finger down: the glass lifts under it, ready to glide or be dragged */
    if(calm.matches||pressAnim||pillSlot===null)return;
    var x=pillX(pillSlot);
    pressAnim=pillEl.animate([{transform:"translateX("+x+"px) scale(1,1)"},{transform:"translateX("+x+"px) scale(1.14,1.08)"}],{duration:150,easing:"cubic-bezier(.3,.9,.3,1)",fill:"forwards"});
    dock.classList.add("glide");
  }
  function unlift(settle){
    if(!pressAnim)return;pressAnim.cancel();pressAnim=null;
    if(settle&&!pillAnim&&!calm.matches){var x=pillX(pillSlot);runPill([{transform:"translateX("+x+"px) scale(1.14,1.08)"},{transform:"translateX("+x+"px) scale(1,1)"}],{duration:220,easing:"cubic-bezier(.3,.8,.3,1)"})}
    else if(!pillAnim)dock.classList.remove("glide");
  }
  function slidePill(slot){
    var to=pillX(slot),from=pillSlot===null?to:pillX(pillSlot),first=pillSlot===null;
    if(slot===pillSlot&&pillAnim){pillEl.style.transform="translateX("+to+"px)";return}
    if(pillAnim){pillAnim.cancel();pillAnim=null}
    var wasLifted=!!pressAnim;
    if(pressAnim){pressAnim.cancel();pressAnim=null}
    var moved=!first&&slot!==pillSlot&&!calm.matches&&pillEl.offsetWidth>0;
    pillSlot=slot;pillEl.style.transform="translateX("+to+"px)";
    if(!moved){
      if(wasLifted&&!calm.matches&&pillEl.offsetWidth>0)runPill([{transform:"translateX("+to+"px) scale(1.14,1.08)"},{transform:"translateX("+to+"px) scale(1,1)"}],{duration:220,easing:"cubic-bezier(.3,.8,.3,1)"});
      else dock.classList.remove("glide");
      return;
    }
    var dir=to>from?1:-1,dist=Math.abs(to-from),mid=(from+to)/2,stretch=1+Math.min(.5,dist/pillEl.offsetWidth*.2);
    runPill([
      {transform:"translateX("+from+"px) scale(1.14,1.08)",offset:0},
      {transform:"translateX("+mid+"px) scale("+(stretch*1.1)+",1.02)",offset:.4},
      {transform:"translateX("+(to+dir*5)+"px) scale(.98,1.03)",offset:.76},
      {transform:"translateX("+to+"px) scale(1,1)",offset:1}
    ],{duration:520,easing:"cubic-bezier(.3,.8,.3,1)"});
    popIcon(slot,110);
  }
  function slotBtn(slot){return slot===2?$("side-dm"):document.querySelector('.dockbar [data-view="'+["home","reels","","profile"][slot]+'"]')}
  function popIcon(slot,delay){var b=slotBtn(slot),ic=b&&b.querySelector("svg.ic,.me");
    if(ic&&!calm.matches)ic.animate([{transform:"scale(.82)"},{transform:"scale(1.16)",offset:.55},{transform:"scale(1)"}],{duration:460,delay:delay||0,easing:"cubic-bezier(.3,.9,.3,1.2)"})}

  /* grab the glass and slide it, like the iOS tab bar: it follows the finger, lifts and stretches, then snaps to the nearest tab when released */
  var drag=null,swallow=0;
  function goSlot(s){if(s===0)view("home");else if(s===1)view("reels");else if(s===2)openDM($("side-dm"));else view("profile")}
  function band(x,max){return x<0?x*.35:x>max?max+(x-max)*.35:x}
  function peek(s){Array.prototype.forEach.call(dock.querySelectorAll("button"),function(b){b.classList.remove("peek")});var b=slotBtn(s);if(b)b.classList.add("peek")}
  dock.addEventListener("pointerdown",function(e){
    if(wide.matches||(e.pointerType==="mouse"&&e.button!==0))return;
    drag={id:e.pointerId,x0:e.clientX,on:false,start:pillSlot,x:pillX(pillSlot),s:pillSlot,pts:[{t:e.timeStamp,x:e.clientX}]};
    lift();
  });
  dock.addEventListener("pointermove",function(e){
    if(!drag||e.pointerId!==drag.id)return;
    var tw=pillEl.offsetWidth,max=3*tw;
    if(!drag.on){
      if(Math.abs(e.clientX-drag.x0)<8)return;
      drag.on=true;try{dock.setPointerCapture(e.pointerId)}catch(_){ }
      if(pillAnim){pillAnim.cancel();pillAnim=null}
      if(pressAnim){pressAnim.cancel();pressAnim=null}
      dock.classList.add("drag");peek(drag.s);
    }
    drag.x=band(pillX(drag.start)+(e.clientX-drag.x0),max);
    var s=Math.max(0,Math.min(3,Math.round(drag.x/tw)));if(s!==drag.s){drag.s=s;peek(s)}
    pillEl.style.transform="translateX("+drag.x+"px) scale(1.16,1.1)";
    drag.pts.push({t:e.timeStamp,x:e.clientX});while(drag.pts.length>2&&e.timeStamp-drag.pts[0].t>110)drag.pts.shift();
  });
  function release(e){
    if(!drag||e.pointerId!==drag.id)return;
    var d=drag;drag=null;
    if(!d.on){setTimeout(function(){unlift(true)},90);return}
    swallow=Date.now()+60;
    var tw=pillEl.offsetWidth,a=d.pts[0],b=d.pts[d.pts.length-1],v=b.t>a.t?(b.x-a.x)/(b.t-a.t):0;
    var target=Math.max(0,Math.min(3,Math.round((d.x+v*140)/tw))),to=pillX(target),dir=to>=d.x?1:-1;
    dock.classList.remove("drag");peek(-1);
    pillSlot=target;pillEl.style.transform="translateX("+to+"px)";
    if(!calm.matches)runPill([
      {transform:"translateX("+d.x+"px) scale(1.16,1.1)",offset:0},
      {transform:"translateX("+(to+dir*4)+"px) scale(.98,1.03)",offset:.62},
      {transform:"translateX("+to+"px) scale(1,1)",offset:1}
    ],{duration:460,easing:"cubic-bezier(.3,.8,.3,1)"});
    else dock.classList.remove("glide");
    popIcon(target,120);
    if(target!==d.start)goSlot(target);
  }
  dock.addEventListener("pointerup",release);dock.addEventListener("pointercancel",release);
  dock.addEventListener("click",function(e){if(Date.now()<swallow){e.stopPropagation();e.preventDefault()}},true);
  window.addEventListener("resize",function(){if(pillSlot!==null)pillEl.style.transform="translateX("+pillX(pillSlot)+"px)"});
  pillSlot=null;
  function dockState(name){
    Array.prototype.forEach.call(document.querySelectorAll(".dockbar button[data-view]"),function(b){if(b.dataset.view===name)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
    if(name==="dm")$("side-dm").setAttribute("aria-current","page");else $("side-dm").removeAttribute("aria-current");
    slidePill({home:0,reels:1,dm:2,profile:3}[name]);
  }
  function openDM(from,draft){
    close();dmOpener=from||null;
    if(!dmStarted){dmStarted=true;
      bubble("them","Hi 👋 Thanks for stopping by.");
      bubble("them","Tell me a little about your brand or the role, and I'll get back to you.");
      (P.quickReplies||["I have a role for you","I need help with my brand","Just saying hi"]).forEach(function(t){var q=el("button","",t);q.type="button";q.addEventListener("click",function(){dmSend(t)});$("dm-quick").appendChild(q)});
    }
    if(draft){dmInput.value=draft;$("dm-go").disabled=false}
    dm.inert=false;dm.classList.add("open");dockState("dm");device.classList.remove("on-dark");
    if(wide.matches)dmInput.focus();
  }
  function closeDM(leaving){if(!dm.classList.contains("open"))return;dm.classList.remove("open");dm.inert=true;if(leaving!==true){dockState(current);device.classList.toggle("on-dark",current==="reels"&&!wide.matches);if(dmOpener&&dmOpener.isConnected)dmOpener.focus({preventScroll:true})}}
  dmInput.addEventListener("input",function(){$("dm-go").disabled=!dmInput.value.trim()});
  $("dm-form").addEventListener("submit",function(e){e.preventDefault();dmSend(dmInput.value)});
  $("dm-back").addEventListener("click",closeDM);
  $("h-mail").setAttribute("aria-label","Message me");
  $("h-mail").addEventListener("click",function(e){e.preventDefault();openDM(this)});
  $("side-dm").addEventListener("click",function(){openDM(this)});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDM()});

  /* pull to refresh (phones): pull Home or Profile down from the top; a spinner shows, then the content slides back in */
  var ptr=$("ptr"),ptrLines=ptr.querySelectorAll("rect"),ptrSt=null,ptrBusy=false,ptrSwallow=0,PTR_TH=56;
  function ptrTargets(v){return Array.prototype.filter.call(v.children,function(c){return !c.classList.contains("top")})}
  function ptrOffset(v,px,snap){ptrTargets(v).forEach(function(t){t.style.transition=snap?"transform .42s var(--ease)":"none";t.style.transform=px?"translateY("+px+"px)":""})}
  function ptrSpokes(p){var n=Math.round(p*12);Array.prototype.forEach.call(ptrLines,function(l,i){l.setAttribute("opacity",i<n?(1-i*.065).toFixed(2):"0.14")})}
  function ptrShow(off,p){ptr.style.transition="none";ptr.style.opacity=Math.min(1,p*1.5);ptr.style.transform="translateY("+(off/2-18)+"px) scale("+(.6+.4*p)+")"}
  function ptrBegin(v,x,y){if(ptrBusy||wide.matches||v.hidden||v.scrollTop>0)return;ptrSt={v:v,x:x,y:y,pull:false,off:0}}
  function ptrMove(x,y,stop){
    if(!ptrSt)return;var dy=y-ptrSt.y,dx=x-ptrSt.x;
    if(!ptrSt.pull){
      if(dy>8&&dy>Math.abs(dx)*1.3&&ptrSt.v.scrollTop<=0)ptrSt.pull=true;
      else if(dy<-8||Math.abs(dx)>14){ptrSt=null;return}else return;
    }
    stop&&stop();
    ptrSt.off=Math.min(100,Math.max(0,dy*.5));ptrOffset(ptrSt.v,ptrSt.off,false);
    var p=Math.min(1,ptrSt.off/PTR_TH);ptrShow(ptrSt.off,p);ptrSpokes(p);
  }
  function ptrEnd(){
    if(!ptrSt)return;var s=ptrSt;ptrSt=null;if(!s.pull)return;ptrSwallow=Date.now()+80;
    if(s.off>=PTR_TH)ptrRun(s.v);else ptrReset(s.v);
  }
  function ptrReset(v){ptrOffset(v,0,true);ptr.style.transition="opacity .25s,transform .35s var(--ease)";ptr.style.opacity=0;ptr.style.transform="translateY(-18px) scale(.6)";ptr.classList.remove("spin")}
  function ptrRun(v){
    ptrBusy=true;ptrOffset(v,56,true);ptrSpokes(1);Array.prototype.forEach.call(ptrLines,function(l,i){l.setAttribute("opacity",(1-i*.075).toFixed(2))});
    ptr.style.transition="opacity .2s,transform .35s var(--ease)";ptr.style.opacity=1;ptr.style.transform="translateY(10px) scale(1)";ptr.classList.add("spin");
    setTimeout(function(){
      ptr.classList.remove("spin");ptrReset(v);v.classList.add("ptr-anim");
      setTimeout(function(){v.classList.remove("ptr-anim");ptrBusy=false},1100);
    },reduce.matches?400:1150);
  }
  ["view-home","view-profile"].forEach(function(id){
    var v=$(id);
    v.addEventListener("touchstart",function(e){var t=e.touches[0];ptrBegin(v,t.clientX,t.clientY)},{passive:true});
    v.addEventListener("touchmove",function(e){var t=e.touches[0];ptrMove(t.clientX,t.clientY,function(){if(e.cancelable)e.preventDefault()})},{passive:false});
    v.addEventListener("touchend",ptrEnd);v.addEventListener("touchcancel",ptrEnd);
    v.addEventListener("mousedown",function(e){if(e.button||e.target.closest("input,textarea"))return;ptrBegin(v,e.clientX,e.clientY)});
    v.addEventListener("click",function(e){if(Date.now()<ptrSwallow){e.stopPropagation();e.preventDefault()}},true);
  });
  window.addEventListener("mousemove",function(e){ptrMove(e.clientX,e.clientY,function(){e.preventDefault()})});
  window.addEventListener("mouseup",ptrEnd);

  /* glass tab bar: Home, Reels, Profile */
  var order=["home","reels","profile"],current="profile";
  function view(name){
    close();closeDM(true);
    order.forEach(function(v){$("view-"+v).hidden=v!==name});
    dockState(name);
    device.classList.toggle("on-dark",name==="reels"&&!wide.matches);document.body.className="v-"+name;
    if(name===current)$("view-"+name).scrollTo({top:0,behavior:"smooth"});
    current=name;
  }
  Array.prototype.forEach.call(document.querySelectorAll(".dockbar button[data-view]"),function(b){b.addEventListener("click",function(){view(b.dataset.view)})});
  current="";view("profile");
})();
</script>
